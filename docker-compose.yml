services:
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pixelate-orchestrator
    restart: unless-stopped
    ports:
      - "${ORCHESTRATOR_PORT:-8000}:8000"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ORCHESTRATOR_HOST: 0.0.0.0
      ORCHESTRATOR_PORT: 8000
      ORCHESTRATOR_PUBLIC_URL: ${ORCHESTRATOR_PUBLIC_URL:-http://orchestrator:8000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://frontend:3000}
      CAMPAIGN_DATA_DIR: /data/campaigns
      AGENTS_SERVICE_URL: ${AGENTS_SERVICE_URL:-http://agents:8001}
      # Sponsor Stack: BAND (band.ai)
      BAND_API_KEY: ${BAND_API_KEY:-}
      BAND_VISUAL_AGENT_KEY: ${BAND_VISUAL_AGENT_KEY:-}
      BAND_COPY_AGENT_KEY: ${BAND_COPY_AGENT_KEY:-}
      BAND_REST_URL: ${BAND_REST_URL:-https://app.band.ai}
      BAND_WS_URL: ${BAND_WS_URL:-wss://app.band.ai/api/v1/socket/websocket}
      BAND_FALLBACK_ON_ERROR: ${BAND_FALLBACK_ON_ERROR:-true}
      ENABLE_LOCAL_AGENT_FALLBACK: ${ENABLE_LOCAL_AGENT_FALLBACK:-true}
      # Sponsor Stack: Agent37 / ADAL / Finch / LLMs
      AGENT37_API_KEY: ${AGENT37_API_KEY:-}
      ADAL_API_KEY: ${ADAL_API_KEY:-}
      FINCH_API_KEY: ${FINCH_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - campaign_data:/data/campaigns
    networks:
      - pixelate_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  agents:
    build:
      context: .
      dockerfile: agents/Dockerfile
    container_name: pixelate-agents
    restart: unless-stopped
    ports:
      - "${AGENTS_PORT:-8001}:8001"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      ORCHESTRATOR_URL: http://orchestrator:8000
      CAMPAIGN_DATA_DIR: /data/campaigns
      # Sponsor Stack: BAND (band.ai)
      BAND_API_KEY: ${BAND_API_KEY:-}
      BAND_VISUAL_AGENT_KEY: ${BAND_VISUAL_AGENT_KEY:-}
      BAND_COPY_AGENT_KEY: ${BAND_COPY_AGENT_KEY:-}
      BAND_REST_URL: ${BAND_REST_URL:-https://app.band.ai}
      BAND_WS_URL: ${BAND_WS_URL:-wss://app.band.ai/api/v1/socket/websocket}
      # Sponsor Stack: ADAL / Finch / Model Providers
      ADAL_API_KEY: ${ADAL_API_KEY:-}
      FINCH_API_KEY: ${FINCH_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - campaign_data:/data/campaigns
    depends_on:
      orchestrator:
        condition: service_healthy
    networks:
      - pixelate_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pixelate-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
      ORCHESTRATOR_INTERNAL_URL: http://orchestrator:8000
    depends_on:
      orchestrator:
        condition: service_healthy
    networks:
      - pixelate_net

volumes:
  campaign_data:
    driver: local

networks:
  pixelate_net:
    driver: bridge
