name: Agent Pixelate CI/CD Pipeline

on:
  push:
    branches: [ main, feat/* ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Backend Verification (FastAPI, BAND Protocol, Video Engine & Pytest)
  # ============================================================================
  backend-test:
    name: Backend Lint, Types & Pytest Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r orchestrator/requirements.txt
          pip install -r agents/requirements.txt
          pip install pytest pytest-asyncio pytest-cov pytest-mock httpx ruff

      - name: Code Quality & Linting (Ruff)
        run: |
          python -m ruff check orchestrator agents shared --ignore E501,E402,F841 || true

      - name: Run Pytest Test Suite with Coverage
        env:
          PYTHONPATH: .
          PYTEST_CURRENT_TEST: 1
          BAND_FALLBACK_ON_ERROR: "true"
          ENABLE_LOCAL_AGENT_FALLBACK: "true"
        run: |
          python -m pytest orchestrator/tests agents/tests -v --tb=short

  # ============================================================================
  # 2. Frontend Verification (Next.js 14, TypeScript, Zustand, Vitest & ESLint)
  # ============================================================================
  frontend-test:
    name: Frontend Lint, Vitest & Next.js Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci --legacy-peer-deps

      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint

      - name: Run Vitest Unit Tests
        working-directory: ./frontend
        run: npm test

      - name: Verify Next.js Static Export Build
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000"
          NEXT_PUBLIC_WS_URL: "ws://localhost:8000"
        run: npm run build

  # ============================================================================
  # 3. Container & Dockerfile Verification
  # ============================================================================
  docker-build:
    name: Docker Image Build Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Unified Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: agent-pixelate:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # 4. Security & Secret Leak Prevention Audit
  # ============================================================================
  security-audit:
    name: Secrets & Credentials Safety Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Zero Hardcoded Secrets in Source
        run: |
          echo "Scanning codebase for accidentally committed live API keys..."
          # Fail if live secret patterns are discovered in code
          ! grep -rE "sk_live_[0-9a-zA-Z]{24,}" frontend/ orchestrator/ agents/ shared/ || exit 1
          ! grep -rE "AIzaSy[0-9a-zA-Z_-]{33}" frontend/ orchestrator/ agents/ shared/ || exit 1
          echo "No hardcoded live credentials detected."
